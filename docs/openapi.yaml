        identificadorAtendimento:
          type: string
          description: Novo rótulo de identificação do pedido
          example: Mesa 04
          maxLength: 60
          minLength: 0
        observacao:
          type: string
          description: Observação do pedido
          maxLength: 500
          minLength: 0
        itens:
          type: array
          description: Lista atualizada de itens do pedido
          items:
            $ref: "#/components/schemas/ItemPedidoCaixaRequestDto"
    ItemPedidoCaixaResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Identificador do item no pedido
        produtoId:
          type: string
          format: uuid
          description: Identificador do produto
        descricaoProduto:
          type: string
          description: Descrição congelada do produto no momento da venda
        quantidade:
          type: number
          description: Quantidade vendida
        precoUnitario:
          type: number
          description: Preço unitário congelado
        custoUnitario:
          type: number
          description: Custo unitário congelado
        desconto:
          type: number
          description: Desconto aplicado ao item
        subtotal:
          type: number
