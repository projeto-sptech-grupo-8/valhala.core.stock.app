openapi: 3.1.0
info:
  title: Valhalla Core Stock API
  description: |
    API de autenticação, usuários, perfis, permissões e estoque.

    Operações autenticadas que alteram estado exigem o header X-XSRF-TOKEN.
    Após login ou refresh, o frontend deve chamar GET /auth/csrf usando o cookie
    HttpOnly accessToken e enviar o campo token retornado nesse header. O token CSRF
    é controlado pelo backend e não é armazenado em cookie.
  version: v1
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Autenticação
  description: Endpoints responsáveis pela autenticação e gerenciamento da sessão
    do usuário.
- name: Produtos
  description: Produtos do estabelecimento autenticado.
- name: Movimentações de estoque
  description: Histórico e alterações auditáveis do saldo dos produtos.
- name: Receitas de drinks
  description: Ingredientes rastreáveis dos drinks do estabelecimento autenticado.
- name: Categorias
  description: Categorias de produtos do estabelecimento autenticado.
- name: Autorizações
  description: "Perfis, funcionalidades e permissões individuais."
- name: Usuários
  description: Operações de gerenciamento de usuários.
paths:
  /drinks/{idDrink}/receita:
    get:
      tags:
      - Receitas de drinks
      summary: Consultar a receita de um drink
      operationId: buscarReceita
      parameters:
      - name: idDrink
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Receita retornada.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngredienteDrinkResponseDto"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão ou drink de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Drink não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    put:
      tags:
      - Receitas de drinks
      summary: Substituir integralmente a receita de um drink
      operationId: substituirReceita
      parameters:
      - name: idDrink
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceitaDrinkRequestDto"
        required: true
      responses:
        "200":
          description: Receita atualizada.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngredienteDrinkResponseDto"
        "400":
          description: Dados ou regras da receita inválidos.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão ou produto de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Drink ou ingrediente não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /autorizacoes/usuarios/{userId}/sobrescritas-permissao:
    put:
      tags:
      - Autorizações
      summary: Substituir GRANTs e REVOKEs individuais do usuário
      operationId: substituirSobrescritasPermissaoUsuario
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequisicaoSobrescritasPermissaoUsuarioDto"
        required: true
      responses:
        "204":
          description: Sobrescritas substituídas.
        "400":
          description: Body inválido ou código repetido.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Usuário ou funcionalidade não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: A alteração removeria o último usuário apto a criar usuários.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão ou de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /autorizacoes/perfis/{profileId}/funcionalidades/codigos:
    put:
      tags:
      - Autorizações
      summary: Substituir funcionalidades de um perfil por códigos
      operationId: substituirFuncionalidadesPerfil
      parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              uniqueItems: true
        required: true
      responses:
        "200":
          description: Funcionalidades substituídas.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespostaPerfilDto"
        "400":
          description: Body inválido.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Perfil ou funcionalidade não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: A alteração removeria o último usuário apto a criar usuários.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão ou de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /usuario:
    get:
      tags:
      - Usuários
      summary: Listar usuários
      description: Retorna usuários do estabelecimento da sessão. Requer USUARIOS_VISUALIZAR.
      operationId: listarUsuarios
      responses:
        "200":
          description: Lista de usuários retornada com sucesso.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespostaUsuarioDto"
        "403":
          description: Usuário sem permissão.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    post:
      tags:
      - Usuários
      summary: Criar usuário
      description: Cria usuário no estabelecimento da sessão. Requer USUARIOS_CRIAR.
      operationId: criarUsuario
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequisicaoCriacaoUsuarioDto"
        required: true
      responses:
        "201":
          description: Usuário criado com sucesso.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespostaUsuarioDto"
        "400":
          description: Dados de entrada inválidos.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: E-mail já cadastrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /produtos:
    get:
      tags:
      - Produtos
      summary: "Listar produtos com filtros, ordenação e paginação aplicados no banco"
      operationId: listarProdutos
      parameters:
      - name: busca
        in: query
        description: "Busca por nome, SKU ou código de barras"
        required: false
        schema:
          type: string
        example: absolut
      - name: categoriaId
        in: query
        description: ID da categoria
        required: false
        schema:
          type: integer
          format: int32
        example: 1
      - name: tipo
        in: query
        description: "Tipo do produto: PADRAO ou DRINK. Omitido: ambos."
        required: false
        schema:
          type: string
          enum:
          - PADRAO
          - DRINK
        example: PADRAO
      - name: ativo
        in: query
        description: "Situação do produto. Omitido: ativos e inativos."
        required: false
        schema:
          type: boolean
        example: true
      - name: pagina
        in: query
        description: "Número da página, iniciado em 0. Padrão: 0."
        required: false
        schema:
          type: string
          minimum: 0
      - name: tamanho
        in: query
        description: "Itens por página. Padrão: 20; máximo: 100."
        required: false
        schema:
          type: string
          maximum: 100
          minimum: 1
      - name: ordenarPor
        in: query
        description: "Campo de ordenação: nome, sku, precoVenda, precoCusto, criadoEm\
          \ ou atualizadoEm. Padrão: nome."
        required: false
        schema:
          type: string
      - name: direcao
        in: query
        description: "Direção da ordenação: ASC ou DESC. Padrão: ASC."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Produtos retornados.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespostaPaginadaDtoProdutoResponseDto"
        "400":
          description: Parâmetros de consulta inválidos.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão para visualizar estoque.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    post:
      tags:
      - Produtos
      summary: Criar produto e gerar SKU no backend
      operationId: criarProduto
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProdutoRequestDto"
        required: true
      responses:
        "201":
          description: Produto criado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProdutoResponseDto"
        "400":
          description: Dados de entrada inválidos.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão ou categoria de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Categoria não encontrada.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /movimentacoes-estoque:
    get:
      tags:
      - Movimentações de estoque
      summary: "Listar movimentações com filtros, ordenação e paginação aplicados\
        \ no banco"
      operationId: listarMovimentacoes
      parameters:
      - name: produtoId
        in: query
        description: "ID do produto movimentado. Omitido: todos os produtos."
        required: false
        schema:
          type: string
          format: uuid
      - name: tipo
        in: query
        description: "Tipo da movimentação. Omitido: todos os tipos."
        required: false
        schema:
          type: string
          enum:
          - ENTRADA_INICIAL
          - ENTRADA
          - SAIDA
          - AJUSTE_POSITIVO
          - AJUSTE_NEGATIVO
          - PERDA
          - SAIDA_DRINK
        example: SAIDA
      - name: usuarioId
        in: query
        description: "ID do usuário que registrou a movimentação. Omitido: todos os\
          \ usuários."
        required: false
        schema:
          type: string
          format: uuid
      - name: dataInicial
        in: query
        description: "Data inicial inclusiva, em yyyy-MM-dd. Omitido: sem limite inferior."
        required: false
        schema:
          type: string
          format: date
        example: 2026-10-01
      - name: dataFinal
        in: query
        description: "Data final inclusiva, em yyyy-MM-dd. Omitido: sem limite superior."
        required: false
        schema:
          type: string
          format: date
        example: 2026-10-31
      - name: pagina
        in: query
        description: "Número da página, iniciado em 0. Padrão: 0."
        required: false
        schema:
          type: string
          minimum: 0
      - name: tamanho
        in: query
        description: "Itens por página. Padrão: 20; máximo: 100."
        required: false
        schema:
          type: string
          maximum: 100
          minimum: 1
      - name: ordenarPor
        in: query
        description: "Campo de ordenação: ocorridoEm, tipo, quantidade ou saldoPosterior.\
          \ Padrão: ocorridoEm."
        required: false
        schema:
          type: string
      - name: direcao
        in: query
        description: "Direção da ordenação: ASC ou DESC. Padrão: DESC."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Movimentações retornadas.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespostaPaginadaDtoMovimentacaoResponseDto"
        "400":
          description: Parâmetros de consulta inválidos.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão para visualizar estoque.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    post:
      tags:
      - Movimentações de estoque
      summary: "Registrar entrada, saída, ajuste ou perda de produto padrão"
      operationId: registrarMovimentacao
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovimentacaoRequestDto"
        required: true
      responses:
        "201":
          description: Movimentação registrada.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovimentacaoResponseDto"
        "400":
          description: "Dados inválidos, estoque insuficiente ou regra violada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão ou produto de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Produto ou estoque não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /movimentacoes-estoque/saida-drink:
    post:
      tags:
      - Movimentações de estoque
      summary: Baixar todos os ingredientes de um drink
      operationId: registrarSaidaDrink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaidaDrinkRequestDto"
        required: true
      responses:
        "201":
          description: Ingredientes baixados.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovimentacaoResponseDto"
        "400":
          description: Receita inválida ou saldo insuficiente.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão ou drink de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: "Drink, ingrediente ou estoque não encontrado."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /categorias:
    get:
      tags:
      - Categorias
      summary: Listar categorias do estabelecimento com filtros e paginação
      operationId: listarCategorias
      parameters:
      - name: busca
        in: query
        description: "Trecho do nome da categoria. Omitido: sem filtro."
        required: false
        schema:
          type: string
        example: beb
      - name: ativo
        in: query
        description: "Situação da categoria. Omitido: retorna ativas e inativas."
        required: false
        schema:
          type: boolean
        example: true
      - name: pagina
        in: query
        description: "Número da página, iniciado em 0. Padrão: 0."
        required: false
        schema:
          type: string
          minimum: 0
      - name: tamanho
        in: query
        description: "Itens por página. Padrão: 20; máximo: 100."
        required: false
        schema:
          type: string
          maximum: 100
          minimum: 1
      - name: ordenarPor
        in: query
        description: "Campo de ordenação: nome, criadoEm ou atualizadoEm. Padrão:\
          \ nome."
        required: false
        schema:
          type: string
      - name: direcao
        in: query
        description: "Direção da ordenação: ASC ou DESC. Padrão: ASC."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Categorias retornadas.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespostaPaginadaDtoCategoriaResponseDto"
        "400":
          description: Parâmetros de consulta inválidos.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão para visualizar estoque.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    post:
      tags:
      - Categorias
      summary: Criar nova categoria no estabelecimento
      operationId: criarCategoria
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaRequestDto"
        required: true
      responses:
        "201":
          description: Categoria criada.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoriaResponseDto"
        "400":
          description: Dados de entrada inválidos.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão para gerenciar estoque.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Nome de categoria duplicado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /autorizacoes/perfis:
    get:
      tags:
      - Autorizações
      summary: Listar perfis do estabelecimento
      operationId: listarPerfis
      responses:
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão ou de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "200":
          description: Perfis retornados.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespostaPerfilDto"
      security:
      - accessTokenCookie: []
    post:
      tags:
      - Autorizações
      summary: Criar perfil
      operationId: criarPerfil
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequisicaoPerfilDto"
        required: true
      responses:
        "201":
          description: Perfil criado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespostaPerfilDto"
        "400":
          description: Body inválido.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Já existe perfil com esse nome.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão ou de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /auth/refresh:
    post:
      tags:
      - Autenticação
      summary: Renovar autenticação
      description: Utiliza o refresh token armazenado no cookie para gerar novos tokens.
      operationId: refresh
      parameters:
      - name: refreshToken
        in: cookie
        description: Cookie HttpOnly com o refresh token.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Autenticação renovada com sucesso.
          headers:
            Set-Cookie:
              description: Cookies HttpOnly accessToken e refreshToken são substituídos.
              style: simple
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespostaAutenticacaoDto"
        "401":
          description: "Refresh token ausente, inválido ou expirado."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - csrfTokenHeader: []
  /auth/logout:
    post:
      tags:
      - Autenticação
      summary: Realizar logout
      description: Invalida os tokens atuais e remove os cookies de autenticação.
      operationId: logout
      parameters:
