        ativo:
          type: boolean
          description: Taxa ativa
        criadoEm:
          type: string
          format: date-time
          description: Data de criação
        atualizadoEm:
          type: string
          format: date-time
          description: Data da última alteração
    ItemPedidoCaixaRequestDto:
      type: object
