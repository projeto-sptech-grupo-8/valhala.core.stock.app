          example: 1
          minimum: 1
        parcelasMaximas:
          type: integer
          format: int32
          description: Número máximo de parcelas
          example: 5
          maximum: 12
          minimum: 1
        valorMinimoParcela:
          type: number
          description: Valor mínimo de cada parcela; nulo quando não houver restrição
          example: "10.00"
          minimum: 0.01
        politicaJuros:
          type: string
          description: Quem absorve os juros do parcelamento
          enum:
          - ABSORVIDA_PELA_LOJA
          - REPASSADA_AO_CLIENTE
          example: ABSORVIDA_PELA_LOJA
        validadeCobrancaSegundos:
