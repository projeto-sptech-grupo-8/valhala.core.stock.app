          type: string
          format: uuid
          description: Usuário que cancelou o pedido
        motivoEstorno:
          type: string
          description: Motivo do estorno
        estornadoPorUsuarioId:
          type: string
          format: uuid
          description: Usuário que estornou o pedido
        criadoEm:
          type: string
          format: date-time
          description: Data/hora de criação
        atualizadoEm:
          type: string
          format: date-time
          description: Data/hora da última atualização
        concluidoEm:
          type: string
          format: date-time
          description: Data/hora de conclusão
        canceladoEm:
          type: string
          format: date-time
          description: Data/hora de cancelamento
        estornadoEm:
