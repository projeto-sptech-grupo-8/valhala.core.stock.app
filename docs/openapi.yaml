    DescontoPedidoCaixaRequestDto:
      type: object
      properties:
        tipoDesconto:
          type: string
          description: "Tipo do desconto: PERCENTUAL ou VALOR"
          enum:
          - PERCENTUAL
          - VALOR
          example: PERCENTUAL
        valorDescontoInformado:
          type: number
          description: Percentual (0.01 a 100) ou valor em reais conforme o tipoDesconto
          example: "15.00"
          minimum: 0.01
        motivo:
          type: string
          description: Motivo do desconto (obrigatório quando acima do limite sem
            autorização direta)
          maxLength: 500
          minLength: 0
        autorizadorEmail:
          type: string
          description: E-mail do gerente/autorizador para aprovação imediata no balcão
        autorizadorSenha:
          type: string
          description: Senha do gerente/autorizador para aprovação imediata no balcão
      required:
      - tipoDesconto
      - valorDescontoInformado
    ConfiguracaoCaixaRequestDto:
      type: object
      properties:
