        token:
          type: string
          example: YxBq8vlPoA1pP2dM0R2N9Q
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      description: Cookie HttpOnly criado por POST /auth/login.
      name: accessToken
      in: cookie
