    DescontoPedidoCaixaRequestDto:
      type: object
      properties:
        tipoDesconto:
          type: string
          description: "Tipo do desconto: PERCENTUAL ou VALOR"
          enum:
          - PERCENTUAL
          - VALOR
          example: PERCENTUAL
        valorDescontoInformado:
          type: number
          description: Percentual (0.01 a 100) ou valor em reais conforme o tipoDesconto
          example: "15.00"
          minimum: 0.01
