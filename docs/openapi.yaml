        in: query
        description: "Usuário responsável pelo evento. Omitido: todos."
        required: false
        schema:
          type: string
          format: uuid
      - name: dataInicio
        in: query
        description: Data inicial do evento no formato ISO (AAAA-MM-DD).
        required: false
        schema:
          type: string
          format: date
      - name: dataFim
        in: query
        description: "Data final do evento no formato ISO (AAAA-MM-DD), inclusiva."
        required: false
        schema:
          type: string
          format: date
      - name: pagina
        in: query
        description: "Número da página, iniciado em 0. Padrão: 0."
        required: false
        schema:
          type: string
          minimum: 0
      - name: tamanho
        in: query
        description: "Itens por página. Padrão: 20; máximo: 100."
        required: false
        schema:
          type: string
          maximum: 100
          minimum: 1
      - name: ordenarPor
        in: query
        description: "Campo de ordenação: ocorridoEm, valor, tipoEvento ou usuarioNome.\
          \ Padrão: ocorridoEm."
        required: false
        schema:
          type: string
      - name: direcao
        in: query
        description: "Direção da ordenação: ASC ou DESC. Padrão: DESC."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Eventos retornados.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespostaPaginadaDtoAuditoriaCaixaResponseDto"
        "400":
          description: Parâmetros de consulta inválidos.
          content:
            '*/*':
