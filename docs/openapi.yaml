          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão para visualizar o caixa.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /caixa/auditoria:
    get:
      tags:
      - Auditoria do caixa
      summary: Listar eventos de auditoria do caixa com filtros e paginação
      operationId: listar
      parameters:
      - name: tipoEvento
        in: query
        description: "Código do evento. Omitido: todos."
        required: false
        schema:
          type: string
        example: FECHAMENTO_CAIXA
      - name: sessaoCaixaId
        in: query
        description: "Sessão de caixa relacionada. Omitido: todas."
        required: false
        schema:
          type: string
          format: uuid
      - name: usuarioId
        in: query
        description: "Usuário responsável pelo evento. Omitido: todos."
        required: false
        schema:
          type: string
          format: uuid
      - name: dataInicio
        in: query
        description: Data inicial do evento no formato ISO (AAAA-MM-DD).
        required: false
        schema:
          type: string
          format: date
      - name: dataFim
        in: query
        description: "Data final do evento no formato ISO (AAAA-MM-DD), inclusiva."
        required: false
        schema:
          type: string
          format: date
      - name: pagina
        in: query
        description: "Número da página, iniciado em 0. Padrão: 0."
        required: false
        schema:
          type: string
          minimum: 0
      - name: tamanho
        in: query
        description: "Itens por página. Padrão: 20; máximo: 100."
        required: false
        schema:
          type: string
          maximum: 100
          minimum: 1
      - name: ordenarPor
        in: query
        description: "Campo de ordenação: ocorridoEm, valor, tipoEvento ou usuarioNome.\
          \ Padrão: ocorridoEm."
        required: false
        schema:
          type: string
      - name: direcao
        in: query
        description: "Direção da ordenação: ASC ou DESC. Padrão: DESC."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Eventos retornados.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespostaPaginadaDtoAuditoriaCaixaResponseDto"
        "400":
          description: Parâmetros de consulta inválidos.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão para visualizar o caixa.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /autorizacoes/usuarios/{userId}/permissoes:
    get:
      tags:
      - Autorizações
      summary: Consultar permissões efetivas e suas origens
      operationId: buscarPermissoesUsuario
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Permissões retornadas.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespostaPermissoesUsuarioDto"
        "404":
          description: Usuário não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão ou de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /autorizacoes/funcionalidades:
    get:
      tags:
      - Autorizações
      summary: Listar funcionalidades disponíveis
      operationId: listarFuncionalidades
      responses:
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão ou de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "200":
          description: Funcionalidades retornadas.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespostaFuncionalidadeDto"
      security:
      - accessTokenCookie: []
  /auth/csrf:
    get:
      tags:
      - Autenticação
      summary: Obter token CSRF da sessão autenticada
      operationId: obterTokenCsrf
      responses:
        "200":
          description: Token CSRF retornado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespostaCsrfTokenDto"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
components:
  schemas:
    IngredienteDrinkRequestDto:
      type: object
      description: Ingrediente rastreável da receita de um drink
      properties:
        produtoId:
          type: string
          format: uuid
        quantidade:
          type: number
          example: 50
        unidadeConsumo:
          type: string
          description: ML para ingrediente fracionado; UN para ingrediente unitário
          enum:
          - ML
          - UN
          example: ML
      required:
      - produtoId
      - quantidade
      - unidadeConsumo
    ReceitaDrinkRequestDto:
      type: object
      description: Receita completa de um drink. A atualização substitui todos os
        ingredientes atuais.
      properties:
        ingredientes:
          type: array
          items:
            $ref: "#/components/schemas/IngredienteDrinkRequestDto"
          minItems: 1
      required:
      - ingredientes
    ApiErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    IngredienteDrinkResponseDto:
      type: object
      description: Ingrediente da receita de um drink
      properties:
        produtoId:
          type: string
          format: uuid
        produtoNome:
          type: string
        quantidade:
          type: number
        unidadeConsumo:
          type: string
          enum:
          - ML
          - UN
    TaxaPagamentoAtualizacaoRequestDto:
      type: object
      properties:
        taxaPercentual:
          type: number
          description: Percentual total sobre o valor da venda
          example: "11.5000"
          maximum: 100.0000
          minimum: 0.0000
        taxaFixa:
          type: number
          description: Valor fixo por transação; zero quando não houver
          example: "0.00"
          minimum: 0.00
        repassarAoCliente:
          type: boolean
          description: Repassa a taxa ao cliente; nulo segue a política de juros da
            configuração
          example: false
        ativo:
          type: boolean
          description: Somente taxas ativas são usadas no cálculo
          example: true
      required:
      - ativo
      - taxaFixa
      - taxaPercentual
    TaxaPagamentoResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identificador da taxa
        forma:
          type: string
          description: Forma de pagamento
          enum:
          - DINHEIRO
          - DEBITO
          - CREDITO
          - PIX
        parcelas:
          type: integer
          format: int32
          description: Número de parcelas
        taxaPercentual:
          type: number
          description: Percentual total sobre o valor da venda
        taxaFixa:
          type: number
          description: Valor fixo por transação
        repassarAoCliente:
          type: boolean
          description: Configuração própria de repasse; nulo segue a política global
        repasseEfetivo:
          type: boolean
          description: "Resultado final: a taxa é repassada ao cliente considerando\
            \ a política global"
        ativo:
          type: boolean
          description: Taxa ativa
        criadoEm:
          type: string
          format: date-time
          description: Data de criação
        atualizadoEm:
          type: string
          format: date-time
          description: Data da última alteração
    ItemPedidoCaixaRequestDto:
      type: object
      properties:
        produtoId:
          type: string
          format: uuid
          description: Identificador do produto ou drink
        quantidade:
          type: number
          description: Quantidade solicitada do item
          example: 2
          minimum: 0.001
      required:
      - produtoId
      - quantidade
    PedidoCaixaAtualizacaoRequestDto:
      type: object
      properties:
        canal:
          type: string
          description: Novo canal de atendimento
