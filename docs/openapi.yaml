          type: string
          enum:
          - VENCIDO
          - VENCE_EM_7_DIAS
          - VENCE_EM_30_DIAS
          - VALIDO
          - SEM_VALIDADE
        example: VENCE_EM_7_DIAS
      - name: venceEmDias
        in: query
        description: Só lotes com validade até hoje + N dias (inclui vencidos).
        required: false
