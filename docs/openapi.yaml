          type: boolean
          description: Habilita cobranças na Point; exige ao menos um terminal ativo
            cadastrado
          example: false
        dinheiroHabilitado:
          type: boolean
          description: Aceita pagamentos em dinheiro
          example: true
        debitoHabilitado:
          type: boolean
          description: Aceita pagamentos em débito
          example: true
        creditoHabilitado:
          type: boolean
          description: Aceita pagamentos em crédito
          example: true
        pixHabilitado:
          type: boolean
          description: Aceita pagamentos via Pix
          example: true
        parcelamentoHabilitado:
          type: boolean
          description: Habilita parcelamento no crédito
          example: false
        parcelasMinimas:
          type: integer
          format: int32
          description: Número mínimo de parcelas
          example: 1
          minimum: 1
        parcelasMaximas:
          type: integer
          format: int32
          description: Número máximo de parcelas
          example: 5
          maximum: 12
          minimum: 1
        valorMinimoParcela:
          type: number
          description: Valor mínimo de cada parcela; nulo quando não houver restrição
          example: "10.00"
          minimum: 0.01
        politicaJuros:
          type: string
          description: Quem absorve os juros do parcelamento
          enum:
          - ABSORVIDA_PELA_LOJA
          - REPASSADA_AO_CLIENTE
          example: ABSORVIDA_PELA_LOJA
        validadeCobrancaSegundos:
          type: integer
          format: int32
          description: "Validade da cobrança na Point, em segundos"
          example: 300
          maximum: 900
          minimum: 60
        limiteDescontoPercentual:
          type: number
          description: Percentual de desconto que dispensa autorização
          example: "10.00"
          maximum: 100.00
          minimum: 0.00
        limiteDescontoValor:
          type: number
          description: Valor de desconto que dispensa autorização
          example: "20.00"
          minimum: 0.00
        imprimirComprovante:
          type: boolean
          description: Imprime comprovante na maquininha
          example: true
        permitirPagamentoManual:
          type: boolean
          description: Permite registrar pagamento manual sem integração com a Point
          example: false
      required:
      - creditoHabilitado
      - debitoHabilitado
      - dinheiroHabilitado
      - imprimirComprovante
      - limiteDescontoPercentual
      - limiteDescontoValor
      - parcelamentoHabilitado
      - parcelasMaximas
      - parcelasMinimas
      - permitirPagamentoManual
      - pixHabilitado
      - pointHabilitado
      - politicaJuros
      - validadeCobrancaSegundos
    ConfiguracaoCaixaResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identificador da configuração
        pointHabilitado:
          type: boolean
          description: Cobrança na Point habilitada
        dinheiroHabilitado:
          type: boolean
          description: Pagamento em dinheiro habilitado
        debitoHabilitado:
          type: boolean
          description: Pagamento em débito habilitado
        creditoHabilitado:
          type: boolean
          description: Pagamento em crédito habilitado
        pixHabilitado:
          type: boolean
          description: Pagamento via Pix habilitado
        parcelamentoHabilitado:
          type: boolean
          description: Parcelamento habilitado
        parcelasMinimas:
          type: integer
          format: int32
          description: Número mínimo de parcelas
        parcelasMaximas:
          type: integer
          format: int32
          description: Número máximo de parcelas
        valorMinimoParcela:
          type: number
          description: Valor mínimo por parcela
        politicaJuros:
          type: string
          description: Política de juros do parcelamento
          enum:
          - ABSORVIDA_PELA_LOJA
          - REPASSADA_AO_CLIENTE
        validadeCobrancaSegundos:
          type: integer
          format: int32
          description: Validade da cobrança em segundos
        limiteDescontoPercentual:
          type: number
          description: Limite percentual de desconto sem autorização
        limiteDescontoValor:
          type: number
          description: Limite em valor de desconto sem autorização
        imprimirComprovante:
          type: boolean
          description: Impressão de comprovante habilitada
        permitirPagamentoManual:
          type: boolean
          description: Pagamento manual habilitado
        atualizadoPorUsuarioId:
          type: string
          format: uuid
          description: Último usuário que alterou a configuração
        criadoEm:
          type: string
          format: date-time
          description: Data de criação
        atualizadoEm:
          type: string
          format: date-time
          description: Data da última alteração
    RequisicaoSobrescritasPermissaoUsuarioDto:
      type: object
      properties:
        sobrescritas:
