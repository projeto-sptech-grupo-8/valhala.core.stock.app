openapi: 3.1.0
info:
  title: Valhalla Core Stock API
  description: |
    API de autenticação, usuários, perfis, permissões e estoque.

    Operações autenticadas que alteram estado exigem o header X-XSRF-TOKEN.
    Após login ou refresh, o frontend deve chamar GET /auth/csrf usando o cookie
    HttpOnly accessToken e enviar o campo token retornado nesse header. O token CSRF
    é controlado pelo backend e não é armazenado em cookie.
  version: v1
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Autenticação
  description: Endpoints responsáveis pela autenticação e gerenciamento da sessão
    do usuário.
- name: Produtos
  description: Produtos do estabelecimento autenticado.
- name: Webhooks Mercado Pago
  description: Recebimento assíncrono e idempotente de eventos de Orders Point do
    Mercado Pago.
- name: Sessões de caixa
  description: "Abertura, operação, fechamento e conferência das sessões de caixa."
- name: Pedidos do caixa (PDV)
  description: "Gestão de pedidos simultâneos, descontos híbridos, pagamentos, conciliaç\
    ão manual e estorno no PDV."
- name: Lotes e validade
  description: "Saldo por lote, validade e indicadores de vencimento. Lotes são criados\
    \ pelas entradas e consumidos pelas saídas (FEFO) em /movimentacoes-estoque."
- name: Movimentações de estoque
  description: Histórico e alterações auditáveis do saldo dos produtos.
- name: Relatórios
  description: "Relatórios gerenciais agregados do estabelecimento autenticado, por\
    \ período em dias."
- name: Dashboard
  description: Indicadores consolidados do estabelecimento autenticado.
- name: Receitas de drinks
  description: Ingredientes rastreáveis dos drinks do estabelecimento autenticado.
- name: Caixas e terminais
  description: Cadastro dos caixas (postos físicos) e das maquininhas vinculadas.
- name: Autorizações
  description: "Perfis, funcionalidades e permissões individuais."
- name: Taxas de pagamento
  description: Taxas estimadas por forma de pagamento e número de parcelas.
- name: Auditoria do caixa
  description: "Trilha de eventos do caixa, incluindo configuração, abertura, fechamento,\
    \ sangria, reforço e divergências."
- name: Financeiro
  description: "Saldo, fluxo de caixa, resultado (DRE) e contas a pagar e receber."
- name: Estabelecimento
  description: Consulta e atualização dos dados cadastrais do estabelecimento autenticado.
- name: Categorias
  description: Categorias de produtos do estabelecimento autenticado.
- name: Notas fiscais do caixa (NFC-e pós-venda)
  description: "Emissão pós-venda de NFC-e (modelo 65) a partir de pedidos concluí\
    dos no caixa, consulta para impressão de DANFE 80mm, download de XML e cancelamento\
    \ fiscal."
- name: Configuração do caixa
  description: Configuração das formas de pagamento e políticas comerciais do estabelecimento.
- name: Usuários
  description: Operações de gerenciamento de usuários.
- name: Terminais Point (Mercado Pago)
  description: Sincronização e modo de operação (PDV/STANDALONE) das maquininhas Mercado
    Pago Point.
paths:
  /financeiro/contas/{idConta}:
    get:
      tags:
      - Financeiro
      summary: Consultar conta
      operationId: obterConta
      parameters:
      - name: idConta
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespostaContaDto"
      security:
      - accessTokenCookie: []
    put:
      tags:
      - Financeiro
      summary: Editar conta em aberto
      operationId: atualizarConta
      parameters:
      - name: idConta
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequisicaoContaDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespostaContaDto"
      security:
      - accessTokenCookie: []
  /estabelecimento:
    get:
      tags:
      - Estabelecimento
      summary: Consultar dados do estabelecimento
      description: Retorna os dados cadastrais da adega vinculada à sessão autenticada.
      operationId: obterEstabelecimento
      responses:
        "200":
          description: Dados do estabelecimento retornados com sucesso.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EstabelecimentoResponseDto"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Estabelecimento não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    put:
      tags:
      - Estabelecimento
      summary: Atualizar dados do estabelecimento
      description: Atualiza os dados cadastrais da adega da sessão. Restrito ao perfil
        Gerente.
      operationId: atualizarEstabelecimento
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstabelecimentoAtualizacaoRequestDto"
        required: true
      responses:
        "200":
          description: Dados do estabelecimento atualizados com sucesso.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EstabelecimentoResponseDto"
        "400":
          description: Dados de entrada inválidos.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Apenas gerente pode alterar dados do estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Estabelecimento não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: CNPJ já cadastrado em outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    patch:
      tags:
      - Estabelecimento
      summary: Atualizar parcialmente dados do estabelecimento
      description: Atualiza os dados cadastrais da adega da sessão. Restrito ao perfil
        Gerente.
      operationId: atualizarEstabelecimentoParcial
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstabelecimentoAtualizacaoRequestDto"
        required: true
      responses:
        "200":
          description: Dados do estabelecimento atualizados com sucesso.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EstabelecimentoResponseDto"
        "400":
          description: Dados de entrada inválidos.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Apenas gerente pode alterar dados do estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Estabelecimento não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: CNPJ já cadastrado em outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /drinks/{idDrink}/receita:
    get:
      tags:
      - Receitas de drinks
      summary: Consultar a receita de um drink
      operationId: buscarReceita
      parameters:
      - name: idDrink
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Receita retornada.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngredienteDrinkResponseDto"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão ou drink de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Drink não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    put:
      tags:
      - Receitas de drinks
      summary: Substituir integralmente a receita de um drink
      operationId: substituirReceita
      parameters:
      - name: idDrink
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceitaDrinkRequestDto"
        required: true
      responses:
        "200":
          description: Receita atualizada.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngredienteDrinkResponseDto"
        "400":
          description: Dados ou regras da receita inválidos.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão ou produto de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Drink ou ingrediente não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /caixa/taxas/{id}:
    put:
      tags:
      - Taxas de pagamento
      summary: Atualizar os valores de uma taxa
      description: A forma e o número de parcelas identificam a linha e não são alterados
        por este endpoint.
      operationId: atualizarTaxa
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxaPagamentoAtualizacaoRequestDto"
        required: true
      responses:
        "200":
          description: Taxa atualizada.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaxaPagamentoResponseDto"
        "400":
          description: Dados de entrada inválidos.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão ou taxa de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Taxa não encontrada.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /caixa/pedidos/{id}:
    get:
      tags:
      - Pedidos do caixa (PDV)
      summary: Consultar o detalhe completo de um pedido com itens e pagamentos
      operationId: buscarPedido
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Pedido encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PedidoCaixaDetalheResponseDto"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Pedido de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Pedido não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    put:
      tags:
      - Pedidos do caixa (PDV)
      summary: "Atualizar itens, canal ou identificador de um pedido em atendimento"
      description: "Substitui a lista de itens enquanto o pedido estiver EM_ATENDIMENTO\
        \ e sem pagamentos ativos, auditando remoções/reduções de itens."
      operationId: atualizarPedido
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoCaixaAtualizacaoRequestDto"
        required: true
      responses:
        "200":
          description: Pedido atualizado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PedidoCaixaDetalheResponseDto"
        "400":
          description: Dados inválidos.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Pedido ou produto não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Pedido não editável ou estoque insuficiente.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /caixa/pedidos/{id}/desconto:
    put:
      tags:
      - Pedidos do caixa (PDV)
      summary: Aplicar ou solicitar desconto no pedido
      description: |
        Aplica o desconto imediatamente quando estiver dentro do limite duplo (% e R$) ou quando
        autorizado por usuário com CAIXA_AUTORIZAR_DESCONTO. Caso contrário, registra a solicitação
        como PENDENTE_AUTORIZACAO para aprovação posterior do gerente.
      operationId: aplicarOuSolicitarDesconto
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DescontoPedidoCaixaRequestDto"
        required: true
      responses:
        "200":
          description: Desconto aplicado ou solicitado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PedidoCaixaDetalheResponseDto"
        "400":
          description: Dados inválidos.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Credenciais do autorizador inválidas ou sem permissão.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Pedido não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Estado inválido do pedido.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    delete:
      tags:
      - Pedidos do caixa (PDV)
      summary: Remover desconto ou solicitação de desconto do pedido
      description: "Limpa qualquer desconto aprovado, pendente ou negado, restaurando\
        \ o total para o subtotal e destravando o pedido para pagamento."
      operationId: removerDesconto
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Desconto removido.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PedidoCaixaDetalheResponseDto"
        "404":
          description: Pedido não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: "Pedido já concluído, cancelado ou estornado."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /caixa/configuracao:
    get:
      tags:
      - Configuração do caixa
      summary: Consultar a configuração atual do caixa
      operationId: obterConfiguracao
      responses:
        "200":
          description: Configuração retornada.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConfiguracaoCaixaResponseDto"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão para visualizar o caixa.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
    put:
      tags:
      - Configuração do caixa
      summary: Substituir a configuração do caixa
      description: |
        Substitui todos os campos de negócio da configuração do estabelecimento.
        Campos controlados pelo servidor (id, estabelecimento, datas e autor) não
        fazem parte do corpo. A ausência de um campo obrigatório retorna 400.
      operationId: atualizarConfiguracao
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfiguracaoCaixaRequestDto"
        required: true
      responses:
        "200":
          description: Configuração atualizada.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConfiguracaoCaixaResponseDto"
        "400":
          description: Dados de entrada inválidos.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão para configurar o caixa.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /autorizacoes/usuarios/{userId}/sobrescritas-permissao:
    put:
      tags:
      - Autorizações
      summary: Substituir GRANTs e REVOKEs individuais do usuário
      operationId: substituirSobrescritasPermissaoUsuario
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequisicaoSobrescritasPermissaoUsuarioDto"
        required: true
      responses:
        "204":
          description: Sobrescritas substituídas.
        "400":
          description: Body inválido ou código repetido.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Usuário ou funcionalidade não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: A alteração removeria o último usuário apto a criar usuários.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão ou de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /autorizacoes/perfis/{profileId}/funcionalidades/codigos:
    put:
      tags:
      - Autorizações
      summary: Substituir funcionalidades de um perfil por códigos
      operationId: substituirFuncionalidadesPerfil
      parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              uniqueItems: true
        required: true
      responses:
        "200":
          description: Funcionalidades substituídas.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespostaPerfilDto"
        "400":
          description: Body inválido.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Perfil ou funcionalidade não encontrado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: A alteração removeria o último usuário apto a criar usuários.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Sessão ausente, inválida ou expirada."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Usuário sem permissão ou de outro estabelecimento.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - accessTokenCookie: []
  /webhooks/mercado-pago/point:
    post:
      tags:
      - Webhooks Mercado Pago
      summary: Receber notificação webhook de pagamento Point
      description: "Valida assinatura HMAC-SHA256 (x-signature), deduplica eventos\
        \ em evento_webhook_pagamento e confirma o estado da Order na API do Mercado\
        \ Pago (Zero-Trust)."
      operationId: receberWebhookPoint
      parameters:
      - name: data.id
        in: query
        required: false
        schema:
          type: string
      - name: id
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: x-signature
        in: header
        required: false
        schema:
          type: string
      - name: x-request-id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        "200":
          description: Webhook recebido e processado idempotentemente.
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Assinatura HMAC inválida ou expirada.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          description: Rate limit de webhook excedido.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /usuario:
    get:
      tags:
      - Usuários
      summary: Listar usuários
      description: Retorna usuários do estabelecimento da sessão. Requer USUARIOS_VISUALIZAR.
      operationId: listarUsuarios
      responses:
        "200":
          description: Lista de usuários retornada com sucesso.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespostaUsuarioDto"
        "403":
          description: Usuário sem permissão.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
