        in: query
        description: "Número da página, iniciado em 0. Padrão: 0."
        required: false
        schema:
          type: string
          minimum: 0
      - name: tamanho
        in: query
        description: "Itens por página. Padrão: 20; máximo: 100."
        required: false
        schema:
          type: string
          maximum: 100
          minimum: 1
      - name: ordenarPor
