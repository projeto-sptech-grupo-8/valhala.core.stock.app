      - debitoHabilitado
      - dinheiroHabilitado
      - imprimirComprovante
      - limiteDescontoPercentual
      - limiteDescontoValor
      - parcelamentoHabilitado
      - parcelasMaximas
      - parcelasMinimas
      - permitirPagamentoManual
      - pixHabilitado
      - pointHabilitado
      - politicaJuros
      - validadeCobrancaSegundos
