        email:
          type: string
          format: email
          description: E-mail utilizado para realizar a autenticação
          example: usuario@exemplo.com
          minLength: 1
        senha:
          type: string
          description: Senha utilizada para realizar a autenticação
          example: Senha@123
          minLength: 1
      required:
      - email
      - senha
    RequisicaoAtualizacaoUsuarioDto:
      type: object
      properties:
        nome:
          type: string
          description: Novo nome do usuário
          example: Lucas Peres
          maxLength: 100
          minLength: 0
        email:
          type: string
          format: email
          description: Novo e-mail do usuário
          example: lucas.novo@exemplo.com
        telefone:
          type: string
          description: Novo telefone do usuário
          example: "11988888888"
          maxLength: 13
          minLength: 0
        senha:
          type: string
          description: Nova senha do usuário
          example: NovaSenha@123
          maxLength: 72
          minLength: 8
        nomePerfil:
          type: string
          description: Novo perfil de acesso do usuário
          example: GERENTE
          maxLength: 100
          minLength: 0
        ativo:
