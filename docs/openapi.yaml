          type: boolean
          description: Pagamento em crédito habilitado
        pixHabilitado:
          type: boolean
          description: Pagamento via Pix habilitado
        parcelamentoHabilitado:
          type: boolean
          description: Parcelamento habilitado
        parcelasMinimas:
          type: integer
          format: int32
          description: Número mínimo de parcelas
        parcelasMaximas:
          type: integer
          format: int32
          description: Número máximo de parcelas
        valorMinimoParcela:
          type: number
          description: Valor mínimo por parcela
        politicaJuros:
          type: string
          description: Política de juros do parcelamento
