          example: "10.00"
          maximum: 100.00
          minimum: 0.00
        limiteDescontoValor:
          type: number
          description: Valor de desconto que dispensa autorização
          example: "20.00"
          minimum: 0.00
        imprimirComprovante:
          type: boolean
          description: Imprime comprovante na maquininha
          example: true
        permitirPagamentoManual:
          type: boolean
          description: Permite registrar pagamento manual sem integração com a Point
          example: false
