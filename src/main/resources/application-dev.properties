# Perfil de desenvolvimento. Ative com "spring.profiles.active=dev" no .env
# ou SPRING_PROFILES_ACTIVE=dev no ambiente.
# NUNCA use este perfil em produção: o seed de demonstração cria usuários com senha conhecida.
