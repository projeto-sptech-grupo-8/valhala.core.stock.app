# Perfil de desenvolvimento. Ative com "spring.profiles.active=dev" no .env
# ou SPRING_PROFILES_ACTIVE=dev no ambiente.
# NUNCA use este perfil em produção: o seed de demonstração cria usuários com senha conhecida.
# Os dados de demonstração (db/demo) são aplicados por DemoDataSeeder, não pelo Flyway.

# Em desenvolvimento o frontend roda em http://localhost e os cookies não podem exigir HTTPS.
# Uma variável de ambiente COOKIE_SECURE definida no processo continua tendo precedência.
app.cookie.secure=false

# SMTP local sem autenticação (ex.: Mailpit em localhost:1025, interface em http://localhost:8025).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
