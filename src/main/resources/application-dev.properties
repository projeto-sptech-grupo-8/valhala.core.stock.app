# Perfil de desenvolvimento: além das migrações, aplica os dados de demonstração (db/demo).
# Ative com SPRING_PROFILES_ACTIVE=dev.
spring.flyway.locations=classpath:db/migration,classpath:db/demo

# SMTP local sem autenticação (ex.: Mailpit em localhost:1025, interface em http://localhost:8025).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
