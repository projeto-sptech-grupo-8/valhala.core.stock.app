spring.application.name=core.stock.app

# Carrega o arquivo .env da raiz do projeto (não versionado) como configuração.
# Variáveis de ambiente reais sempre têm precedência sobre os valores do .env.
# Referência completa: docs/CONFIGURACAO.md
spring.config.import=optional:file:.env[.properties]

# Arquivos usam Elastic Common Schema (JSON); o console permanece legível e colorido.
logging.structured.format.file=ecs

# Banco de dados: DB_URL e DB_USERNAME têm padrão local; DB_PASSWORD é obrigatório.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/valhalla}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# O banco existente é registrado na versão 0 e recebe as migrações seguintes.
# Em um banco vazio, execute primeiro db/script.sql e, opcionalmente, db/seed-inicial.sql.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
# Tolerado apenas para migrações repetíveis já aplicadas e depois removidas do
# classpath (caso do antigo seed db/demo/R__dados_demonstracao.sql). Migrações
# versionadas continuam sendo validadas de forma estrita.
spring.flyway.ignore-migration-patterns=repeatable:missing

# JWT_SECRET é obrigatório: Base64 com pelo menos 32 bytes, diferente por ambiente.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:PT1H}
security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:P7D}

# FRONTEND_URL aceita uma ou mais origens separadas por vírgula, sem barra final.
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Padrão seguro: cookies apenas via HTTPS. O perfil dev sobrescreve para false.
app.cookie.secure=${COOKIE_SECURE:true}
