spring.application.name=core.stock.app

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/valhalla}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=PT1H
security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:P7D}

app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
app.cookie.secure=${COOKIE_SECURE:false}
